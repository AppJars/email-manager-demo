# Guided tour
appjars.emailmanager.demo.tour.btn.next=Next
appjars.emailmanager.demo.tour.btn.back=Back
appjars.emailmanager.demo.tour.btn.done=Done
appjars.emailmanager.demo.tour.emails.grid.title=The e-mail list
appjars.emailmanager.demo.tour.emails.grid.desc=Every e-mail is listed here with its sender, subject, delivery status and creation date. The demo ships with sample e-mails in each state so you can try every action.
appjars.emailmanager.demo.tour.emails.status.title=Delivery status
appjars.emailmanager.demo.tour.emails.status.desc=The status column shows a colored badge for each e-mail:<ul><li><b>Created</b> — a draft that has not been sent yet.</li><li><b>Send pending</b> — queued, waiting for the background sender.</li><li><b>Send successful</b> — delivered to the SMTP server.</li><li><b>Send failed</b> — delivery failed; the error can be inspected.</li></ul>
appjars.emailmanager.demo.tour.emails.filters.title=Search & filter
appjars.emailmanager.demo.tour.emails.filters.desc=Filter the list by address, subject or status and press Filter to narrow it down. On narrow screens the filters move behind a button.
appjars.emailmanager.demo.tour.emails.create.title=Compose a new e-mail
appjars.emailmanager.demo.tour.emails.create.desc=Click this button to open the compose dialog — the tour continues inside it.
appjars.emailmanager.demo.tour.emails.compose.title=The compose dialog
appjars.emailmanager.demo.tour.emails.compose.desc=Everything an e-mail needs is set here:<ul><li><b>From</b> — picked from the default senders configured.</li><li><b>Recipients</b> — the to, CC and BCC lists, with as many addresses as you need.</li><li><b>Subject and body</b> — write the message, and tick <b>HTML</b> to send it as HTML instead of plain text.</li><li><b>Attachments</b> — upload files and remove them again from the list below.</li><li><b>Save</b> — stores the e-mail as <i>Created</i>; sending it is a separate action on the list.</li></ul>Try the fields out — Next discards this draft and closes the dialog.
appjars.emailmanager.demo.tour.emails.actions.title=Per-row actions
appjars.emailmanager.demo.tour.emails.actions.desc=We just opened the actions menu of the first e-mail for you (each row has one). The available options depend on the e-mail''s status:<ul><li><b>Send</b> — send the e-mail now.</li><li><b>Add to / remove from queue</b> — hand it to (or take it back from) the background sender.</li><li><b>Edit</b> — change any of its fields.</li><li><b>Preview HTML</b> — render an HTML body (HTML e-mails only).</li><li><b>Show error details</b> — inspect the failure stack trace (failed e-mails only).</li><li><b>Delete</b> — remove the e-mail.</li></ul>
appjars.emailmanager.demo.tour.emails.license.title=Free mode
appjars.emailmanager.demo.tour.emails.license.desc=In free mode you can successfully send up to 5 e-mails per day; the counter above the grid tracks the quota. Every other feature works without limits. A full license removes the cap.

# Templates
appjars.emailmanager.demo.menuitem.templateList=Templates
appjars.emailmanager.demo.home.features.templates.title=Reusable templates
appjars.emailmanager.demo.home.features.templates.desc=Keep your recurring e-mails as templates in the database, edit them in a WYSIWYG editor with a live preview, and apply one to a new e-mail in a click.
appjars.emailmanager.demo.home.features.placeholders.title=Placeholders
appjars.emailmanager.demo.home.features.placeholders.desc=Templates carry named {{placeholders}} that are replaced with your values when applied. No template language to learn — substitution and nothing else.
appjars.emailmanager.demo.home.tryit.templates=Open templates
appjars.emailmanager.demo.home.tour.templates=Templates view

# Guided tour - templates
appjars.emailmanager.demo.tour.templates.grid.title=The template list
appjars.emailmanager.demo.tour.templates.grid.desc=Every template is listed with its language, whether it is active, how many placeholders it declares and when it was last changed. The demo ships five samples: an HTML one with a table layout, a Spanish variant of it, a plain-text one, one with a deliberate typo, and a retired one that is inactive.
appjars.emailmanager.demo.tour.templates.filters.title=Search & filter
appjars.emailmanager.demo.tour.templates.filters.desc=Filter by name, description or status. As on the e-mail list, the filters move behind a button on narrow screens.
appjars.emailmanager.demo.tour.templates.create.title=Create a template
appjars.emailmanager.demo.tour.templates.create.desc=Click this button to open the editor — the tour continues inside it.
appjars.emailmanager.demo.tour.templates.editor.title=The template editor
appjars.emailmanager.demo.tour.templates.editor.desc=The editor is the form on the left and a live preview on the right:<ul><li><b>Design / HTML source</b> — edit the body visually or as raw HTML; both are the same value, so you can switch freely. A plain-text template has only the source view.</li><li><b>Subject and body</b> — both may contain placeholders.</li><li><b>Language</b> — templates can have one variant per language, sharing a name.</li><li><b>Active</b> — an inactive template stays listed but is never offered when composing.</li></ul>The preview re-renders as you type, substituting each placeholder''s sample value. Try the fields out — Next discards this draft and closes the editor.
appjars.emailmanager.demo.tour.templates.placeholders.title=Placeholders
appjars.emailmanager.demo.tour.templates.placeholders.desc=A placeholder is written <code>{{customerName}}</code> and is replaced with a value when the template is applied. Text that does not match that shape is left exactly as written.<ul><li><b>Declare</b> one to give it a label, a sample value for the preview, and to mark it required.</li><li><b>Insert</b> drops the token at the cursor; in the visual editor it becomes a single chip you cannot half-delete.</li><li><b>Available</b> lists what this application offers to every template — see <code>DemoPlaceholderCatalog</code> in the demo sources.</li><li>A placeholder used but never declared is flagged, which is what a typo looks like. Open <i>Monthly report</i> to see the warning.</li></ul>There are no conditionals or loops: substitution and nothing else, which is what keeps the WYSIWYG editor safe to use.
appjars.emailmanager.demo.tour.templates.apply.title=Using a template
appjars.emailmanager.demo.tour.templates.apply.desc=Templates are applied from the e-mail side: open <b>Emails</b>, start a new e-mail and click <b>Apply template</b> in the dialog footer. Pick a template, fill in its placeholders — they are pre-filled with the sample values — and the subject and body are written into the form, ready to edit and send. The e-mail keeps no link back to the template, so editing the template later never changes an e-mail you already composed.
