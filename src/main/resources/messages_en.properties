# Home (landing page)
appjars.emailmanager.demo.home.title=Email Manager Demo
appjars.emailmanager.demo.home.hero.logoAlt=AppJars
appjars.emailmanager.demo.home.hero.title=Email Manager
appjars.emailmanager.demo.home.hero.tagline=Compose, queue and send e-mails from your application, and keep a full audit trail of every delivery attempt — all managed from a single view.
appjars.emailmanager.demo.home.features.title=What''s inside
appjars.emailmanager.demo.home.features.compose.title=Compose & edit
appjars.emailmanager.demo.home.features.compose.desc=Create e-mails with sender, recipients, CC and BCC, subject and body, and edit any draft before it is sent.
appjars.emailmanager.demo.home.features.send.title=Send over SMTP
appjars.emailmanager.demo.home.features.send.desc=Send an e-mail on demand through your configured SMTP server, or let the built-in scheduler deliver it for you.
appjars.emailmanager.demo.home.features.queue.title=Delivery queue
appjars.emailmanager.demo.home.features.queue.desc=Add e-mails to the pending queue and a background task sends them on a configurable cron schedule.
appjars.emailmanager.demo.home.features.status.title=Delivery status
appjars.emailmanager.demo.home.features.status.desc=Every e-mail carries a status badge — created, pending, sent or failed — so you always know where it stands.
appjars.emailmanager.demo.home.features.errors.title=Error diagnostics
appjars.emailmanager.demo.home.features.errors.desc=When a delivery fails, inspect the captured stack trace and retry the send once the problem is fixed.
appjars.emailmanager.demo.home.features.html.title=HTML e-mails
appjars.emailmanager.demo.home.features.html.desc=Write rich HTML bodies and preview exactly how they will render before sending.
appjars.emailmanager.demo.home.features.attachments.title=Attachments
appjars.emailmanager.demo.home.features.attachments.desc=Attach one or more files to an e-mail and manage them from the compose dialog.
appjars.emailmanager.demo.home.features.filters.title=Search & filter
appjars.emailmanager.demo.home.features.filters.desc=Filter the e-mail list by address, subject or delivery status to quickly find what you need.
appjars.emailmanager.demo.home.tryit.title=Try it now
appjars.emailmanager.demo.home.tryit.intro=This demo needs no login: open the e-mail view below and start composing, queueing and sending right away. The list already contains sample e-mails in every state so you can explore all the features.
appjars.emailmanager.demo.home.tryit.emails=Open e-mails
appjars.emailmanager.demo.home.tour.button=Guided tour
appjars.emailmanager.demo.home.tour.emails=E-mails view
appjars.emailmanager.demo.home.license.title=Free vs. full license
appjars.emailmanager.demo.home.license.desc=This demo runs in free mode: every feature is fully functional, limited to 5 successfully sent e-mails per day. A full license removes the limit — nothing else changes.
appjars.emailmanager.demo.home.license.link=Get a license at appjars.com
appjars.emailmanager.demo.home.links.title=Learn more
appjars.emailmanager.demo.home.links.github=AppJars on GitHub
appjars.emailmanager.demo.home.links.readme=Email Manager documentation

# Guided tour
appjars.emailmanager.demo.tour.btn.next=Next
appjars.emailmanager.demo.tour.btn.back=Back
appjars.emailmanager.demo.tour.btn.done=Done
appjars.emailmanager.demo.tour.emails.grid.title=The e-mail list
appjars.emailmanager.demo.tour.emails.grid.desc=Every e-mail is listed here with its sender, subject, delivery status and creation date. The demo ships with sample e-mails in each state so you can try every action.
appjars.emailmanager.demo.tour.emails.status.title=Delivery status
appjars.emailmanager.demo.tour.emails.status.desc=The status column shows a colored badge for each e-mail:<ul><li><b>Created</b> — a draft that has not been sent yet.</li><li><b>Send pending</b> — queued, waiting for the background sender.</li><li><b>Send successful</b> — delivered to the SMTP server.</li><li><b>Send failed</b> — delivery failed; the error can be inspected.</li></ul>
appjars.emailmanager.demo.tour.emails.filters.title=Search & filter
appjars.emailmanager.demo.tour.emails.filters.desc=Filter the list by address, subject or status and press Filter to narrow it down. On narrow screens the filters move behind a button.
appjars.emailmanager.demo.tour.emails.create.title=Compose a new e-mail
appjars.emailmanager.demo.tour.emails.create.desc=Click this button to open the compose dialog — the tour continues inside it.
appjars.emailmanager.demo.tour.emails.compose.title=The compose dialog
appjars.emailmanager.demo.tour.emails.compose.desc=Everything an e-mail needs is set here:<ul><li><b>From</b> — picked from the default senders configured.</li><li><b>Recipients</b> — the to, CC and BCC lists, with as many addresses as you need.</li><li><b>Subject and body</b> — write the message, and tick <b>HTML</b> to send it as HTML instead of plain text.</li><li><b>Attachments</b> — upload files and remove them again from the list below.</li><li><b>Save</b> — stores the e-mail as <i>Created</i>; sending it is a separate action on the list.</li></ul>Try the fields out — Next discards this draft and closes the dialog.
appjars.emailmanager.demo.tour.emails.actions.title=Per-row actions
appjars.emailmanager.demo.tour.emails.actions.desc=We just opened the actions menu of the first e-mail for you (each row has one). The available options depend on the e-mail''s status:<ul><li><b>Send</b> — send the e-mail now.</li><li><b>Add to / remove from queue</b> — hand it to (or take it back from) the background sender.</li><li><b>Edit</b> — change any of its fields.</li><li><b>Preview HTML</b> — render an HTML body (HTML e-mails only).</li><li><b>Show error details</b> — inspect the failure stack trace (failed e-mails only).</li><li><b>Delete</b> — remove the e-mail.</li></ul>
appjars.emailmanager.demo.tour.emails.license.title=Free mode
appjars.emailmanager.demo.tour.emails.license.desc=In free mode you can successfully send up to 5 e-mails per day; the counter above the grid tracks the quota. Every other feature works without limits. A full license removes the cap.
