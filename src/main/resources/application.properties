# ============================================================
# Datasource (H2 file database)
# ============================================================

# JDBC URL of the H2 file database; the demo data survives a restart
spring.datasource.url=jdbc:h2:./data/emailmanagerdemo;FILE_LOCK=NO

# JDBC driver class
spring.datasource.driverClassName=org.h2.Driver

# Datasource user
spring.datasource.username=sa

# Datasource password
spring.datasource.password=

# Serve the H2 web console at /h2-console
spring.h2.console.enabled=true

# ============================================================
# JPA / Hibernate
# ============================================================

# Schema generation strategy (none, validate, update, create, create-drop)
spring.jpa.hibernate.ddl-auto=update

# Log the SQL statements Hibernate issues
spring.jpa.show-sql=false

# Keep the persistence context open for the duration of a request
spring.jpa.open-in-view=true

# ============================================================
# Vaadin
# ============================================================

# i18n provider that supplies the translations
vaadin.i18n.provider=com.appjars.utils.i18n.AppjarsI18nProvider

# ============================================================
# Uploads
# ============================================================

# Largest single file the servlet container accepts
spring.servlet.multipart.max-file-size=100MB

# Largest total upload request the servlet container accepts
spring.servlet.multipart.max-request-size=100MB

# ============================================================
# Mail sender (SMTP)
# ============================================================
# These values match the throwaway SMTP server in docker-compose.yml, which takes
# no credentials and speaks no TLS. A real relay needs the credentials filled in
# and auth and STARTTLS turned back on.

# SMTP host
spring.mail.host=localhost

# SMTP port
spring.mail.port=1025

# Transport protocol
spring.mail.protocol=smtp

# User to authenticate as
spring.mail.username=

# Password to authenticate with
spring.mail.password=

# Whether the relay requires authentication
spring.mail.properties.mail.smtp.auth=false

# Upgrade the connection with STARTTLS
spring.mail.properties.mail.smtp.starttls.enable=false

# ============================================================
# Email Manager - Composing
# ============================================================

# Sender addresses offered in the compose dialog. A single address makes the field
# read-only; several turn it into a picker
com.appjars.emailmanager.from=example@example.com

# Largest attachment accepted, in bytes
com.appjars.emailmanager.attachments.max-size=26214400

# Attachments accepted per e-mail
com.appjars.emailmanager.attachments.max-files=5

# Comma-separated allow-list of attachment content types. Leave the value empty to
# accept any type. Browsers disagree on some types: a .zip is application/zip on
# most and application/x-zip-compressed on Windows Chrome and Edge
com.appjars.emailmanager.attachments.accepted-types=application/pdf,\
  image/png,image/jpeg,image/gif,image/webp,image/svg+xml,\
  text/plain,text/csv,\
  application/zip,application/x-zip-compressed,\
  application/msword,\
  application/vnd.openxmlformats-officedocument.wordprocessingml.document,\
  application/vnd.ms-excel,\
  application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,\
  application/vnd.ms-powerpoint,\
  application/vnd.openxmlformats-officedocument.presentationml.presentation

# ============================================================
# Email Manager - View routes
# ============================================================

# Route the e-mail list is registered under. It must not be empty: the demo home
# page owns the root route
com.appjars.emailmanager.url.views.emailcrudview=em/list

# ============================================================
# Email Manager - Scheduled sending
# ============================================================

# Cron expression driving the queued-mail sender (default: 0/30 * * * * *)
email.task.cronexpression=0/10 * * * * *
